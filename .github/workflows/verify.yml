name: Validate web app

on:
  push:
    branches:
      - main
      - ui/responsive-redesign
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --project tsconfig.app.json --noEmit
      - name: Build production bundle
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright
      - name: Smoke test at mobile, tablet and desktop widths
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run preview -- --host 127.0.0.1 &
          sleep 5
          node tests/smoke.cjs
